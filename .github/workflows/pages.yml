name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: node tools/selftest.mjs
      # Pages'i açmak repo sahibinin işi: Settings → Pages → Source: GitHub Actions.
      # İş akışının token'ı siteyi oluşturamaz; açılana kadar bu adım başarısız olur.
      - uses: actions/configure-pages@v5
      - run: mkdir _site && cp -r index.html app.css *.js data styles .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
